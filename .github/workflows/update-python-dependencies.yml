name: Update Python dependencies

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

concurrency:
  group: bump-python-dependencies
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.1.0

    - name: Upgrade script lockfiles
      id: upgrade
      run: |
        uv lock --script build.py --upgrade
        uv lock --script .github/scripts/checkver.py --upgrade
        if git diff --quiet -- build.py.lock .github/scripts/checkver.py.lock; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # checkver also runs build.py --discover using its own locked dependencies.
    - name: Run scripts with updated dependencies
      if: ${{ steps.upgrade.outputs.changed == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: uv run --locked .github/scripts/checkver.py

    - name: Create dependency update pull request
      if: ${{ steps.upgrade.outputs.changed == 'true' }}
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ github.token }}
        branch: bump-python-dependencies
        base: ${{ github.event.repository.default_branch }}
        delete-branch: true
        add-paths: |
          build.py.lock
          .github/scripts/checkver.py.lock
        commit-message: 'chore(deps): update Python script lockfiles'
        title: 'chore(deps): bump Python dependencies'
        body: |
          Monthly update of Python script dependencies.
