name: nightly

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build workflow artifacts only, even when no new version is detected
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkver:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.check_new_version.outputs.version }}
      should_build: ${{ steps.check_new_version.outputs.should_build }}
      should_release: ${{ steps.check_new_version.outputs.should_release }}
      notes_url: ${{ steps.check_new_version.outputs.notes_url }}

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          build.py.lock
          .github/scripts/checkver.py.lock
    - name: Discover and compare versions
      id: check_new_version
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
      run: uv run --locked .github/scripts/checkver.py

  build:
    runs-on: windows-${{ matrix.arch == 'arm' && '2022' || 'latest' }}
    needs: checkver
    if: ${{ needs.checkver.outputs.should_build == 'true' }}
    strategy:
      matrix:
        arch: [x64, x86, arm64, arm]

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: build.py.lock
        cache-suffix: ${{ matrix.arch }}
    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: ${{ matrix.arch != 'x64' && 'amd64_' || '' }}${{ matrix.arch }}
        sdk: ${{ matrix.arch == 'arm' && '10.0.22621.0' || '' }}

    - name: Build
      env:
        LESS_VERSION: ${{ needs.checkver.outputs.version }}
      run: uv run --locked .\build.py $env:LESS_VERSION

    - name: Upload less to artifact
      uses: actions/upload-artifact@v7
      with:
        name: less-${{ matrix.arch }}
        path: less.exe
        if-no-files-found: error

  release:
    needs: [checkver, build]
    if: ${{ needs.checkver.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write

    steps:
    - name: Get all artifacts
      uses: actions/download-artifact@v8
    - name: Zip each artifact
      run: find . -type d ! -path . -execdir zip -9 -rj "{}.zip" "{}" \;

    - id: get_workflow_runtime
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --jq '"updated_at=\(.updated_at)"' >> "$GITHUB_OUTPUT"

    - uses: softprops/action-gh-release@v3
      with:
        files: '*.zip'
        body: |
          Built with GitHub Actions at ${{ steps.get_workflow_runtime.outputs.updated_at }}

          Release notes can be found [here](${{ needs.checkver.outputs.notes_url }}).
        tag_name: less-v${{ needs.checkver.outputs.version }}
        discussion_category_name: Announcements
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget:
    name: Publish to WinGet
    needs: [checkver, release]
    runs-on: ubuntu-latest

    steps:
    - uses: vedantmgoyal9/winget-releaser@main
      with:
        identifier: jftuga.less
        version: ${{ needs.checkver.outputs.version }}
        release-tag: less-v${{ needs.checkver.outputs.version }}
        installers-regex: '\.zip$'
        token: ${{ secrets.WINGET_TOKEN }}
