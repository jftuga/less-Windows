name: nightly

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build workflow artifacts only, even when no new version is detected
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkver:
    runs-on: ubuntu-latest

    outputs:
      builds: ${{ steps.check_new_version.outputs.builds }}
      releases: ${{ steps.check_new_version.outputs.releases }}

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          build.py.lock
          .github/scripts/checkver.py.lock
    - name: Discover and compare versions
      id: check_new_version
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
      run: uv run --locked .github/scripts/checkver.py

  build:
    runs-on: windows-${{ matrix.arch == 'arm' && '2022' || 'latest' }}
    needs: checkver
    if: ${{ needs.checkver.outputs.builds != '[]' }}
    strategy:
      matrix:
        release: ${{ fromJSON(needs.checkver.outputs.builds) }}
        arch: [x64, x86, arm64, arm]

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: build.py.lock
        cache-suffix: ${{ matrix.arch }}
    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: ${{ matrix.arch != 'x64' && 'amd64_' || '' }}${{ matrix.arch }}
        sdk: ${{ matrix.arch == 'arm' && '10.0.22621.0' || '' }}

    - name: Build
      env:
        LESS_VERSION: ${{ matrix.release.version }}
        LESS_BETA: ${{ matrix.release.beta }}
      run: |
        $buildArguments = @('--locked', '.\build.py', $env:LESS_VERSION)
        if ($env:LESS_BETA -eq 'true') { $buildArguments += '--beta' }
        uv run @buildArguments

    - name: Upload less to artifact
      uses: actions/upload-artifact@v7
      with:
        name: less-${{ matrix.release.version }}-${{ matrix.arch }}
        path: less.exe
        if-no-files-found: error

  release:
    needs: [checkver, build]
    # Promotions can run even when builds are skipped or fail.
    if: ${{ !cancelled() && needs.checkver.result == 'success' && needs.checkver.outputs.releases != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.checkver.outputs.releases) }}
    permissions:
      contents: write
      discussions: write

    steps:
    - name: Get version artifacts
      if: ${{ !matrix.release.promote && needs.build.result == 'success' }}
      uses: actions/download-artifact@v8
      with:
        pattern: less-${{ matrix.release.version }}-*
        path: artifacts
    - name: Zip each artifact
      if: ${{ !matrix.release.promote && needs.build.result == 'success' }}
      env:
        LESS_VERSION: ${{ matrix.release.version }}
      run: |
        for arch in x64 x86 arm64 arm; do
          zip -9 -j "less-${arch}.zip" "artifacts/less-${LESS_VERSION}-${arch}/less.exe"
        done

    - id: get_workflow_runtime
      if: ${{ !matrix.release.promote && needs.build.result == 'success' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --jq '"updated_at=\(.updated_at)"' >> "$GITHUB_OUTPUT"

    - name: Create release
      if: ${{ !matrix.release.promote && needs.build.result == 'success' }}
      uses: softprops/action-gh-release@v3
      with:
        files: '*.zip'
        body: |
          Built with GitHub Actions at ${{ steps.get_workflow_runtime.outputs.updated_at }}

          Release notes can be found [here](${{ matrix.release.notes_url }}).
        tag_name: ${{ matrix.release.tag_name }}
        name: ${{ matrix.release.tag_name }}${{ matrix.release.beta && ' beta' || '' }}
        prerelease: ${{ matrix.release.beta }}
        make_latest: ${{ matrix.release.make_latest }}
        discussion_category_name: ${{ !matrix.release.beta && 'Announcements' || '' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Promote existing beta
      if: ${{ matrix.release.promote }}
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ matrix.release.tag_name }}
        name: ${{ matrix.release.name }}
        prerelease: false
        make_latest: ${{ matrix.release.make_latest }}
        discussion_category_name: Announcements

    - name: Publish to WinGet
      if: ${{ !matrix.release.beta && (matrix.release.promote || needs.build.result == 'success') }}
      uses: vedantmgoyal9/winget-releaser@main
      with:
        identifier: jftuga.less
        version: ${{ matrix.release.version }}
        release-tag: ${{ matrix.release.tag_name }}
        installers-regex: '\.zip$'
        token: ${{ secrets.WINGET_TOKEN }}
